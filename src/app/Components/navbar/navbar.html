<header 
  class="navbar"
  [class.scrolled]="scrollService.isScrolled()"
  role="banner"
>
  <div class="container navbar-container">
    <!-- Brand Logo -->
    <a href="#" class="brand-logo" (click)="scrollTo('top'); $event.preventDefault();">
      <div class="logo-mark">
        <svg width="34" height="34" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 20 H50 C65 20 75 30 75 45 C75 60 65 70 50 70 H20 Z" stroke="#E51E2B" stroke-width="12" stroke-linejoin="round"/>
          <circle cx="35" cy="35" r="8" fill="#E51E2B"/>
          <circle cx="65" cy="45" r="8" fill="#0B0F19"/>
          <line x1="35" y1="35" x2="65" y2="45" stroke="#0B0F19" stroke-width="4"/>
        </svg>
      </div>
      <div class="logo-text">
        <span class="logo-title">DIGITAL <span class="accent">BOND</span></span>
        <span class="logo-sub">AGENCY</span>
      </div>
    </a>

    <!-- Desktop Navigation Links -->
    <nav class="desktop-nav" aria-label="Main Navigation">
      <ul class="nav-list">
        @for (item of navItems; track item.sectionId) {
          <li>
            <button 
              type="button" 
              class="nav-link"
              (click)="scrollTo(item.sectionId)"
            >
              {{ item.label }}
            </button>
          </li>
        }
      </ul>
    </nav>

    <!-- Navbar Action CTA -->
    <div class="navbar-actions">
      <button 
        type="button" 
        class="btn btn-primary nav-cta"
        (click)="scrollTo('contact')"
      >
        <span>Let's Bond</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>

      <!-- Mobile Hamburger Toggle -->
      <button 
        type="button" 
        class="mobile-toggle"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-label="Toggle mobile menu"
        (click)="toggleMobileMenu()"
      >
        <span class="hamburger" [class.active]="mobileMenuOpen()"></span>
      </button>
    </div>
  </div>

  <!-- Mobile Dropdown Navigation -->
  @if (mobileMenuOpen()) {
    <div class="mobile-menu animate-slide-down">
      <nav aria-label="Mobile Navigation">
        <ul class="mobile-nav-list">
          @for (item of navItems; track item.sectionId) {
            <li>
              <button 
                type="button" 
                class="mobile-nav-link"
                (click)="scrollTo(item.sectionId)"
              >
                {{ item.label }}
              </button>
            </li>
          }
          <li class="mobile-cta-wrapper">
            <button 
              type="button" 
              class="btn btn-primary w-full"
              (click)="scrollTo('contact')"
            >
              Let's Bond Together
            </button>
          </li>
        </ul>
      </nav>
    </div>
  }
</header>
